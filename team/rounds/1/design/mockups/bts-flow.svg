<rect width="360" height="620" fill="#FAF8F4"/>
<g>
<rect class="b" x="40" y="10" width="280" height="50" rx="8"/><text class="n" x="56" y="40">1</text><text class="t" x="80" y="40">Brief: conductor</text>
<rect class="b" x="40" y="76" width="280" height="50" rx="8"/><text class="n" x="56" y="106">2</text><text class="t" x="80" y="106">Research: researcher</text>
