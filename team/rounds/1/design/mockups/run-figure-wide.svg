<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">The twelve-step run, three phases and three safeguards (wide)</title><desc id="d">Mock-up. Twelve steps in three phases (save, delete, restore), with three safeguards that held throughout the run. Step wording to come from research/facts.json.</desc>
<style>.ph{font-weight:700;font-size:20px;fill:#1C1B19}.sub{font-size:14px;fill:#4A4740}.n{font:700 15px ui-monospace,Menlo,Consolas,monospace;fill:#FFFFFF}.st{font-size:14px;fill:#1C1B19}.sg{font-size:14px;fill:#1C1B19;font-weight:600}.box{fill:#FFFFFF;stroke:#DDD8CE}.dot{fill:#1D5C63}.rail{fill:#E4EEEF;stroke:#1D5C63}</style>
<rect width="1200" height="560" fill="#FAF8F4"/><text class="ph" x="24" y="40">1. Save</text><text class="sub" x="24" y="62">memory saved, as an encrypted SGit checkpoint</text><rect class="box" x="24" y="84" width="360" height="56" rx="8"/><circle class="dot" cx="52" cy="112" r="16"/><text class="n" x="52" y="117" text-anchor="middle">1</text><text class="st" x="80" y="117">Step 1 wording (from research)</text><rect class="box" x="24" y="156" width="360" height="56" rx="8"/><circle class="dot" cx="52" cy="184" r="16"/><text class="n" x="52" y="189" text-anchor="middle">2</text><text class="st" x="80" y="189">Step 2 wording (from research)</text><rect class="box" x="24" y="228" width="360" height="56" rx="8"/><circle class="dot" cx="52" cy="256" r="16"/><text class="n" x="52" y="261" text-anchor="middle">3</text><text class="st" x="80" y="261">Step 3 wording (from research)</text><rect class="box" x="24" y="300" width="360" height="56" rx="8"/><circle class="dot" cx="52" cy="328" r="16"/><text class="n" x="52" y="333" text-anchor="middle">4</text><text class="st" x="80" y="333">Step 4 wording (from research)</text><path d="M390 230 h20" stroke="#1D5C63" stroke-width="2" marker-end="url(#a)"/><text class="ph" x="416" y="40">2. Delete</text><text class="sub" x="416" y="62">the project is deleted</text><rect class="box" x="416" y="84" width="360" height="56" rx="8"/><circle class="dot" cx="444" cy="112" r="16"/><text class="n" x="444" y="117" text-anchor="middle">5</text><text class="st" x="472" y="117">Step 5 wording (from research)</text><rect class="box" x="416" y="156" width="360" height="56" rx="8"/><circle class="dot" cx="444" cy="184" r="16"/><text class="n" x="444" y="189" text-anchor="middle">6</text><text class="st" x="472" y="189">Step 6 wording (from research)</text><rect class="box" x="416" y="228" width="360" height="56" rx="8"/><circle class="dot" cx="444" cy="256" r="16"/><text class="n" x="444" y="261" text-anchor="middle">7</text><text class="st" x="472" y="261">Step 7 wording (from research)</text><rect class="box" x="416" y="300" width="360" height="56" rx="8"/><circle class="dot" cx="444" cy="328" r="16"/><text class="n" x="444" y="333" text-anchor="middle">8</text><text class="st" x="472" y="333">Step 8 wording (from research)</text><path d="M782 230 h20" stroke="#1D5C63" stroke-width="2" marker-end="url(#a)"/><text class="ph" x="808" y="40">3. Restore</text><text class="sub" x="808" y="62">fresh process, same SHA-256 fingerprint</text><rect class="box" x="808" y="84" width="360" height="56" rx="8"/><circle class="dot" cx="836" cy="112" r="16"/><text class="n" x="836" y="117" text-anchor="middle">9</text><text class="st" x="864" y="117">Step 9 wording (from research)</text><rect class="box" x="808" y="156" width="360" height="56" rx="8"/><circle class="dot" cx="836" cy="184" r="16"/><text class="n" x="836" y="189" text-anchor="middle">10</text><text class="st" x="864" y="189">Step 10 wording (from research)</text><rect class="box" x="808" y="228" width="360" height="56" rx="8"/><circle class="dot" cx="836" cy="256" r="16"/><text class="n" x="836" y="261" text-anchor="middle">11</text><text class="st" x="864" y="261">Step 11 wording (from research)</text><rect class="box" x="808" y="300" width="360" height="56" rx="8"/><circle class="dot" cx="836" cy="328" r="16"/><text class="n" x="836" y="333" text-anchor="middle">12</text><text class="st" x="864" y="333">Step 12 wording (from research)</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D5C63"/></marker></defs><rect class="rail" x="24" y="392" width="1152" height="34" rx="17"/><text class="sg" x="44" y="414">Safeguard 1 (wording from research)</text><text class="sub" x="1156" y="414" text-anchor="end">held from step 1 to step 12</text><rect class="rail" x="24" y="436" width="1152" height="34" rx="17"/><text class="sg" x="44" y="458">Safeguard 2 (wording from research)</text><text class="sub" x="1156" y="458" text-anchor="end">held from step 1 to step 12</text><rect class="rail" x="24" y="480" width="1152" height="34" rx="17"/><text class="sg" x="44" y="502">Safeguard 3 (wording from research)</text><text class="sub" x="1156" y="502" text-anchor="end">held from step 1 to step 12</text><text class="sub" x="24" y="540">Fingerprint: SHA-256 at step [save] = SHA-256 at step [restore]</text></svg>