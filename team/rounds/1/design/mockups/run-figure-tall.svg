<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1224" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">The twelve-step run, three phases and three safeguards (phone)</title><desc id="d">Mock-up. Twelve steps in three phases (save, delete, restore), with three safeguards that held throughout the run. Step wording to come from research/facts.json.</desc>
<style>.ph{font-weight:700;font-size:20px;fill:#1C1B19}.sub{font-size:14px;fill:#4A4740}.n{font:700 15px ui-monospace,Menlo,Consolas,monospace;fill:#FFFFFF}.st{font-size:14px;fill:#1C1B19}.sg{font-size:14px;fill:#1C1B19;font-weight:600}.box{fill:#FFFFFF;stroke:#DDD8CE}.dot{fill:#1D5C63}.rail{fill:#E4EEEF;stroke:#1D5C63}</style>
<rect width="360" height="1224" fill="#FAF8F4"/><rect class="rail" x="10" y="20" width="12" height="1054" rx="6"/><rect class="rail" x="28" y="20" width="12" height="1054" rx="6"/><rect class="rail" x="46" y="20" width="12" height="1054" rx="6"/><text class="ph" x="70" y="52">1. Save</text><text class="sub" x="70" y="74">memory saved</text><text class="sub" x="70" y="92">as an encrypted SGit checkpoint</text><rect class="box" x="70" y="110" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="136" r="14"/><text class="n" x="94" y="141" text-anchor="middle">1</text><text class="st" x="118" y="141">Step 1 wording</text><rect class="box" x="70" y="174" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="200" r="14"/><text class="n" x="94" y="205" text-anchor="middle">2</text><text class="st" x="118" y="205">Step 2 wording</text><rect class="box" x="70" y="238" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="264" r="14"/><text class="n" x="94" y="269" text-anchor="middle">3</text><text class="st" x="118" y="269">Step 3 wording</text><rect class="box" x="70" y="302" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="328" r="14"/><text class="n" x="94" y="333" text-anchor="middle">4</text><text class="st" x="118" y="333">Step 4 wording</text><text class="ph" x="70" y="396">2. Delete</text><text class="sub" x="70" y="418">the project is deleted</text><rect class="box" x="70" y="436" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="462" r="14"/><text class="n" x="94" y="467" text-anchor="middle">5</text><text class="st" x="118" y="467">Step 5 wording</text><rect class="box" x="70" y="500" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="526" r="14"/><text class="n" x="94" y="531" text-anchor="middle">6</text><text class="st" x="118" y="531">Step 6 wording</text><rect class="box" x="70" y="564" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="590" r="14"/><text class="n" x="94" y="595" text-anchor="middle">7</text><text class="st" x="118" y="595">Step 7 wording</text><rect class="box" x="70" y="628" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="654" r="14"/><text class="n" x="94" y="659" text-anchor="middle">8</text><text class="st" x="118" y="659">Step 8 wording</text><text class="ph" x="70" y="722">3. Restore</text><text class="sub" x="70" y="744">fresh process</text><text class="sub" x="70" y="762">same SHA-256 fingerprint</text><rect class="box" x="70" y="780" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="806" r="14"/><text class="n" x="94" y="811" text-anchor="middle">9</text><text class="st" x="118" y="811">Step 9 wording</text><rect class="box" x="70" y="844" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="870" r="14"/><text class="n" x="94" y="875" text-anchor="middle">10</text><text class="st" x="118" y="875">Step 10 wording</text><rect class="box" x="70" y="908" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="934" r="14"/><text class="n" x="94" y="939" text-anchor="middle">11</text><text class="st" x="118" y="939">Step 11 wording</text><rect class="box" x="70" y="972" width="280" height="52" rx="8"/><circle class="dot" cx="94" cy="998" r="14"/><text class="n" x="94" y="1003" text-anchor="middle">12</text><text class="st" x="118" y="1003">Step 12 wording</text><text class="sg" x="10" y="1102">Held throughout the run:</text><rect class="rail" x="10" y="1116" width="12" height="22" rx="6"/><text class="st" x="32" y="1132">S1: safeguard 1 wording</text><rect class="rail" x="10" y="1148" width="12" height="22" rx="6"/><text class="st" x="32" y="1164">S2: safeguard 2 wording</text><rect class="rail" x="10" y="1180" width="12" height="22" rx="6"/><text class="st" x="32" y="1196">S3: safeguard 3 wording</text></svg>