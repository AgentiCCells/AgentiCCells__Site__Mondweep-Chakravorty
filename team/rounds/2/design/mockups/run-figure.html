<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock-up: the run, drawn</title>
<!-- Round 2 design mock-up, change 2: the proof of concept as the centrepiece. Proposal, not the site.
     Data: POC.steps (titles, phase, at = time in his 104.7 s video), POC.safeguards (steps 4, 6, 11), POC.results,
     POC.vaultSteps (5 written, 8 read, 11 read and rejected), POC.fingerprint (step 5 = step 8).
     Steps 2, 5 and 8 have no video time in the source: they are drawn hollow, between their neighbours, and say so.
     Placing each result on the step it describes is ours; the results themselves are the run's own summary (step 12).
     The scale strip is SVG (role="img"); the steps are a real <ol>, so the text alternative is the page itself. -->
<style>
:root{--bg:#FAF8F4;--ink:#1C1B19;--muted:#4A4740;--accent:#1D5C63;--rule:#D8D2C6;
  --setup:#E4EEEC;--save:#F3E9D6;--restore:#E6E8F2;--check:#EFE3E3;
  --pass:#1E6B3A;--blocked:#9B1C1C;--nv:#6B5310;--gold:#B07A12;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0625rem/1.6 var(--sans)}
.wrap{max-width:76rem;margin:0 auto;padding:2rem 1rem}
h2{font:800 clamp(1.9rem,4vw,2.8rem)/1.08 var(--sans);letter-spacing:-.02em;margin:0 0 .5rem}
.kicker{font:700 .8rem/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
figure.run2{margin:1.5rem 0;background:#FFFFFF;border:1px solid var(--rule);border-radius:1rem;padding:1.25rem}
.scale{display:none;width:100%;height:auto}
.scale text{font:15px var(--sans);fill:var(--ink)}
.scale .t{fill:var(--muted);font:14px var(--mono)}
.scale .ax{stroke:var(--ink);stroke-width:1.5}
.scale .tick{stroke:var(--muted)}
.scale .node{fill:var(--accent)}.scale .hollow{fill:#FFFFFF;stroke:var(--accent);stroke-width:2;stroke-dasharray:3 3}
.scale .nn{fill:#FFFFFF;font:700 14px var(--sans);text-anchor:middle}.scale .hn{fill:var(--accent)}
.scale .sg{fill:none;stroke:var(--gold);stroke-width:3}
.scale .badge{font:700 13px var(--sans);text-anchor:middle}
.scale .fp{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
@media (min-width:64rem){.scale{display:block}}
/* the steps: one vertical timeline under 64rem, four phase columns from 64rem */
.phases{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.75rem}
@media (min-width:64rem){.phases{grid-template-columns:1fr 1fr 1.2fr .95fr;gap:.5rem}}
.phase{border-radius:.6rem;padding:.75rem .9rem}
.phase.setup{background:var(--setup)}.phase.save{background:var(--save)}.phase.restore{background:var(--restore)}.phase.check{background:var(--check)}
.phase h3{font:800 .8rem/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:0 0 .4rem}
.phase ol{list-style:none;padding:0;margin:0}
.phase li{display:grid;grid-template-columns:2.4rem 1fr;gap:.1rem .6rem;padding:.45rem 0;border-top:1px solid rgb(0 0 0/.08)}
.phase li:first-child{border-top:0}
.n{grid-row:span 2;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#FFFFFF;font:700 .9rem/2rem var(--sans);text-align:center}
.n.notime{background:#FFFFFF;color:var(--accent);border:2px dashed var(--accent);line-height:1.75rem}
.st{font-weight:650;line-height:1.3}
.meta{font:.82rem/1.4 var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:.25rem .5rem}
.res{font:700 .78rem/1.5 var(--sans);letter-spacing:.04em;padding:0 .4rem;border-radius:.25rem;color:#FFFFFF}
.res.pass{background:var(--pass)}.res.blocked{background:var(--blocked)}.res.nv{background:var(--nv)}
.sgb{font:700 .78rem/1.5 var(--sans);border:2px solid var(--gold);color:#6B4A08;padding:0 .35rem;border-radius:.25rem}
.vault{font:.78rem/1.5 var(--mono);border:1px solid var(--muted);padding:0 .35rem;border-radius:.25rem}
figcaption{font-size:.95rem;color:var(--muted);margin-top:.9rem}
.key{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.9rem;margin:.75rem 0 0;padding:0;list-style:none}
</style>
</head>
<body>
<div class="wrap">
<p class="kicker">The proof of concept</p>
<h2>The run, second by second</h2>
<p>His video replays a real terminal run in twelve steps, in 104.7 seconds. [1]</p>

<figure class="run2" aria-labelledby="run2-cap">
<svg class="scale" viewBox="0 0 1220 250" role="img" aria-labelledby="sc-t sc-d">
  <title id="sc-t">The twelve steps on the 104.7 second video</title>
  <desc id="sc-d">Four phase bands across the video: set up to about 27 seconds, save under the policy to about 48, lose it and bring it back to about 77, check and conclude to the end. Safeguards at steps 4 (0:32), 6 (0:45) and 11 (1:20). The fingerprint saved at step 5 matches the one after the restore at step 8. Steps 2, 5 and 8 have no time in the video summary. The same steps are listed in full below.</desc>
  <!-- x = 60 + seconds * 10.5 -->
  <rect x="60" y="20" width="278" height="150" fill="var(--setup)"/>
  <rect x="338" y="20" width="226" height="150" fill="var(--save)"/>
  <rect x="564" y="20" width="305" height="150" fill="var(--restore)"/>
  <rect x="869" y="20" width="290" height="150" fill="var(--check)"/>
  <text x="70" y="42" font-weight="700">Set up</text><text x="348" y="42" font-weight="700">Save under the policy</text>
  <text x="574" y="42" font-weight="700">Lose it and bring it back</text><text x="879" y="42" font-weight="700">Check and conclude</text>
  <line class="ax" x1="60" y1="110" x2="1160" y2="110"/>
  <g class="tick"><line x1="60" y1="170" x2="60" y2="182"/><line x1="375" y1="170" x2="375" y2="182"/><line x1="690" y1="170" x2="690" y2="182"/><line x1="1005" y1="170" x2="1005" y2="182"/><line x1="1159" y1="170" x2="1159" y2="182"/></g>
  <text class="t" x="60" y="200" text-anchor="middle">0:00</text><text class="t" x="375" y="200" text-anchor="middle">0:30</text><text class="t" x="690" y="200" text-anchor="middle">1:00</text><text class="t" x="1005" y="200" text-anchor="middle">1:30</text><text class="t" x="1159" y="200" text-anchor="end">104.7 s</text>
  <!-- fingerprint arc, step 5 to step 8 -->
  <path class="fp" d="M464 96 C500 78 625 78 664 96"/><text x="564" y="70" text-anchor="middle" font-size="13">same SHA-256</text>
  <!-- nodes: timed steps solid, untimed hollow -->
  <circle class="node" cx="155" cy="110" r="14"/><text class="nn" x="155" y="115">1</text>
  <circle class="hollow" cx="218" cy="110" r="14"/><text class="nn hn" x="218" y="115">2</text>
  <circle class="node" cx="281" cy="110" r="14"/><text class="nn" x="281" y="115">3</text>
  <circle class="node" cx="396" cy="110" r="14"/><text class="nn" x="396" y="115">4</text><circle class="sg" cx="396" cy="110" r="21"/>
  <circle class="hollow" cx="464" cy="110" r="14"/><text class="nn hn" x="464" y="115">5</text>
  <circle class="node" cx="533" cy="110" r="14"/><text class="nn" x="533" y="115">6</text><circle class="sg" cx="533" cy="110" r="21"/>
  <circle class="node" cx="596" cy="110" r="14"/><text class="nn" x="596" y="115">7</text>
  <circle class="hollow" cx="664" cy="110" r="14"/><text class="nn hn" x="664" y="115">8</text>
  <circle class="node" cx="732" cy="110" r="14"/><text class="nn" x="732" y="115">9</text>
  <circle class="node" cx="837" cy="110" r="14"/><text class="nn" x="837" y="115">10</text>
  <circle class="node" cx="900" cy="110" r="14"/><text class="nn" x="900" y="115">11</text><circle class="sg" cx="900" cy="110" r="21"/>
  <circle class="node" cx="963" cy="110" r="14"/><text class="nn" x="963" y="115">12</text>
  <!-- results under the axis -->
  <text class="badge" x="396" y="155" fill="var(--pass)">PASS</text>
  <text class="badge" x="533" y="155" fill="var(--blocked)">BLOCKED</text>
  <text class="badge" x="664" y="155" fill="var(--pass)">PASS</text>
  <text class="badge" x="732" y="155" fill="var(--pass)">PASS 2/2</text>
  <text class="badge" x="900" y="155" fill="var(--blocked)">BLOCKED</text>
  <text class="badge" x="1050" y="155" fill="var(--nv)">NOT VALIDATED: recall by meaning</text>
  <line x1="963" y1="128" x2="990" y2="145" stroke="var(--nv)"/>
</svg>

<ol class="phases" aria-label="The twelve steps, in four phases">
  <li class="phase setup"><h3>Set up</h3><ol>
    <li><span class="n" aria-hidden="true">1</span><span class="st">A real, pinned runtime</span><span class="meta"><span>0:09</span><span>ruflo --version returns v3.56.10</span></span></li>
    <li><span class="n notime" aria-hidden="true">2</span><span class="st">Define the mandate</span><span class="meta"><span>no time given</span></span></li>
    <li><span class="n" aria-hidden="true">3</span><span class="st">Store two facts through Ruflo</span><span class="meta"><span>0:21</span></span></li>
  </ol></li>
  <li class="phase save"><h3>Save under the policy</h3><ol>
    <li><span class="n" aria-hidden="true">4</span><span class="st">Try something outside its permission</span><span class="meta"><span>0:32</span><span class="sgb">Safeguard 1: refused</span><span class="res pass">PASS</span></span></li>
    <li><span class="n notime" aria-hidden="true">5</span><span class="st">Save an encrypted recovery point</span><span class="meta"><span>no time given</span><span class="vault">vault: written</span></span></li>
    <li><span class="n" aria-hidden="true">6</span><span class="st">Approval means stop</span><span class="meta"><span>0:45</span><span class="sgb">Safeguard 2: stopped</span><span class="res blocked">BLOCKED</span></span></li>
  </ol></li>
  <li class="phase restore"><h3>Lose it and bring it back</h3><ol>
    <li><span class="n" aria-hidden="true">7</span><span class="st">Remove the original workspace</span><span class="meta"><span>0:51</span></span></li>
    <li><span class="n notime" aria-hidden="true">8</span><span class="st">Restore in a fresh process</span><span class="meta"><span>no time given</span><span class="vault">vault: read</span><span class="res pass">PASS</span></span></li>
    <li><span class="n" aria-hidden="true">9</span><span class="st">Ask Ruflo what it remembers</span><span class="meta"><span>1:04</span><span class="res pass">PASS 2/2</span></span></li>
    <li><span class="n" aria-hidden="true">10</span><span class="st">A missing fact stays missing</span><span class="meta"><span>1:14</span><span>Key not found</span></span></li>
  </ol></li>
  <li class="phase check"><h3>Check and conclude</h3><ol>
    <li><span class="n" aria-hidden="true">11</span><span class="st">Change the saved copy, try again</span><span class="meta"><span>1:20</span><span class="sgb">Safeguard 3: rejected</span><span class="vault">vault: read and rejected</span><span class="res blocked">BLOCKED</span></span></li>
    <li><span class="n" aria-hidden="true">12</span><span class="st">What this run proves</span><span class="meta"><span>1:26</span><span class="res nv">NOT VALIDATED</span><span>recall by meaning</span></span></li>
  </ol></li>
</ol>
<ul class="key" aria-label="Key">
  <li><span class="sgb">Safeguard</span> tested at its own step</li>
  <li><span class="res pass">PASS</span> <span class="res blocked">BLOCKED</span> from the run's own summary</li>
  <li><span class="vault">vault</span> the encrypted checkpoint is touched</li>
  <li>Dashed number: no time in the video summary</li>
</ul>
<figcaption id="run2-cap">SHA-256 of the database saved at step 5 = SHA-256 after the restore at step 8. Times are from his video. The phases are this site's grouping. [1] [2]</figcaption>
</figure>
</div>
</body>
</html>
